<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting...</title>
  <link rel="canonical" href="https://imtyo.vercel.app">
  <noscript><meta http-equiv="refresh" content="3; url=https://imtyo.vercel.app"></noscript>

  <script data-goatcounter="https://imtyo.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>

  <script>
    setTimeout(function () {
      location.replace("https://imtyo.vercel.app/?" + encodeURIComponent(location.pathname));
    }, 800);
    window.addEventListener("DOMContentLoaded", function () {
      document.getElementById("redirect-link").href =
        "https://imtyo.vercel.app/?" + encodeURIComponent(location.pathname);
    });
  </script>
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center;
           min-height: 100vh; margin: 0; text-align: center; color: #333; }
  </style>
</head>
<body>
  <p>Redirecting to imtyo.app...<br>
     <a id="redirect-link" href="https://imtyo.vercel.app">Click here</a> if you’re not redirected automatically.</p>
</body>
</html>
